<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 32 32">
  <!-- 展示版图标（圆角磨砂玻璃底座）。仅用于 README 展示，不参与应用构建；
       实际图标来自 assets/icon.svg（透明背景小屋标记）。 -->
  <defs>
    <!-- 底座：浅色磨砂玻璃（Material 3 tonal surface + 薄荷倾向） -->
    <linearGradient id="glass" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#FBFDFC"/>
      <stop offset="0.55" stop-color="#EAF2F0"/>
      <stop offset="1" stop-color="#D6E4E0"/>
    </linearGradient>
    <!-- 屋身：黑色玻璃，顶部略亮形成体积感 -->
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B31"/>
      <stop offset="0.45" stop-color="#14181C"/>
      <stop offset="1" stop-color="#0A0C0F"/>
    </linearGradient>
    <!-- 玻璃下的光晕，制造"磨砂"的层次 -->
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
    <filter id="sheen" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- 小屋在玻璃底座上的柔和投影 -->
    <filter id="elev" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.9" flood-color="#0D0F12" flood-opacity="0.38"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="32" height="32" rx="7.4"/>
    </clipPath>
  </defs>

  <!-- ── 磨砂玻璃底座 ────────────────────────────────── -->
  <g clip-path="url(#tileClip)">
    <rect x="0" y="0" width="32" height="32" fill="url(#glass)"/>
    <ellipse cx="7" cy="6" rx="9" ry="7.5" fill="#00E5A3" opacity="0.42" filter="url(#soft)"/>
    <ellipse cx="27" cy="27" rx="10" ry="8.5" fill="#60A5FA" opacity="0.30" filter="url(#soft)"/>
    <path d="M-6 22 L14 -6 L22 -6 L2 26 Z" fill="#FFFFFF" opacity="0.34" filter="url(#sheen)"/>
  </g>
  <rect x="0.45" y="0.45" width="31.1" height="31.1" rx="7.05" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.9"/>
  <rect x="0.25" y="0.25" width="31.5" height="31.5" rx="7.2" fill="none"
        stroke="#0D0F12" stroke-opacity="0.14" stroke-width="0.5"/>

  <!-- ── 黑色玻璃小屋 ────────────────────────────────── -->
  <g filter="url(#elev)">
    <path d="M16 5.5 L25.1 13.5 L6.9 13.5 Z" fill="url(#house)"
          stroke="url(#house)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M8 12.8 H24 V23.3 A2.9 2.9 0 0 1 21.1 26.2 H10.9 A2.9 2.9 0 0 1 8 23.3 Z"
          fill="url(#house)"/>
  </g>
  <!-- 屋顶玻璃高光：左侧屋脊内侧，与屋檐间距同最初版本，长度略长 -->
  <path d="M15.9 6.6 L10.3 11.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.30"
        stroke-width="0.85" stroke-linecap="round"/>

  <!-- ── 居中的白色 G ────────────────────────────────── -->
  <path d="M19.47 16.53 A4.2 4.2 0 1 0 19.72 22.2 L19.72 19.6 L16.7 19.6"
        fill="none" stroke="#FFFFFF" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── 绿色 zzz：走向与屋檐斜线平行（约 41°），由屋内向外飘出，
       1 在屋内 / 2 压交界 / 3 在屋外，三枚彼此分离 ───────────── -->
  <g stroke="#00E5A3" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20 11 h1.05 l-1.05 1.3 h1.05"/>
    <path d="M22.2 9 h1.05 l-1.05 1.3 h1.05"/>
    <path d="M24.4 7 h1.05 l-1.05 1.3 h1.05"/>
  </g>
</svg>

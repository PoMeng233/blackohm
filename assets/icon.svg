<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 32 32">
  <!-- BlackOhm 图标本体（透明背景）：黑色小屋 + 居中白 G + 右上角绿色 zzz。
       这是所有实际图标（UI / 托盘 / exe）的唯一来源，见 tool/generate_icons.py。
       圆角玻璃底座版本仅用于 README 展示：docs/icon-showcase.svg -->
  <defs>
    <!-- 屋身：黑色玻璃，顶部略亮形成体积感 -->
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B31"/>
      <stop offset="0.45" stop-color="#14181C"/>
      <stop offset="1" stop-color="#0A0C0F"/>
    </linearGradient>
  </defs>

  <!-- ── 1. 小屋（屋顶圆角三角 + 屋身，顶部齐平、底部圆角） ── -->
  <path d="M16 5.5 L25.1 13.5 L6.9 13.5 Z" fill="url(#house)"
        stroke="url(#house)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M8 12.8 H24 V23.3 A2.9 2.9 0 0 1 21.1 26.2 H10.9 A2.9 2.9 0 0 1 8 23.3 Z"
        fill="url(#house)"/>
  <!-- 屋顶玻璃高光：左侧屋脊内侧，与屋檐间距同最初版本，长度略长 -->
  <path d="M15.9 6.6 L10.3 11.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.30"
        stroke-width="0.85" stroke-linecap="round"/>

  <!-- ── 2. 居中的白色 G ─────────────────────────────── -->
  <path d="M19.47 16.53 A4.2 4.2 0 1 0 19.72 22.2 L19.72 19.6 L16.7 19.6"
        fill="none" stroke="#FFFFFF" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── 3. 绿色 zzz：走向与屋檐斜线平行（约 41°），由屋内向外飘出，
       1 在屋内 / 2 压交界 / 3 在屋外，三枚彼此分离 ───────────── -->
  <g stroke="#00E5A3" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M20 11 h1.05 l-1.05 1.3 h1.05"/>
    <path d="M22.2 9 h1.05 l-1.05 1.3 h1.05"/>
    <path d="M24.4 7 h1.05 l-1.05 1.3 h1.05"/>
  </g>
</svg>
